name: 📦 Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]*"

jobs:
  build-and-publish:
    name: 🚀 Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/kajihs-utils/

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📦 Install Hatch
        run: pip install hatch

      - name: 🛠️ Build package
        run: hatch build

      - name: 🚀 Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

      - name: 📝 Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Adapted from: https://github.com/squidfunk/mkdocs-material/discussions/7038
  deploy-docs:
    name: 📘 Deploy MkDocs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # Retrieved from deploy-pages action

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            docs
            includes
            tools
            src/kajihs_utils/__about__.py

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          python-version: 3.12
          activate-environment: true
          enable-cache: true

      - name: 📥 Install dependencies
        run: uv sync --group docs

      - run: mkdocs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "site/"
      - uses: actions/deploy-pages@v4
        id: deployment
